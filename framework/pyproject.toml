[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "doppel-framework"
version = "0.1.0"
description = "Controlled Android task execution framework and developer gateway"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
dependencies = [
  "fastapi>=0.141,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "httpx2>=2.12,<3",
  "pydantic>=2.12,<3", "mcp>=2.1,<3", "openpyxl>=3.1,<4", "PyYAML>=6,<7",
  "jsonschema>=4.26,<5", "referencing>=0.37,<1", "python-multipart>=0.0.32,<1",
  "deepseek-harness-sdk==0.1.2rc1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2"]

[project.scripts]
doppel = "doppel.cli:main"

[tool.setuptools.packages.find]
where = ["python"]
include = ["doppel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]
asyncio_mode = "auto"
